# SPDX-License-Identifier: MIT
.catalog:
  name: PastureStack Amazon EFS Storage
  version: v0.10.0
  description: Mount existing Amazon EFS filesystems, with controlled opt-in provisioning.
  minimum_rancher_version: v1.6.15-rc1
  questions:
  - variable: AWS_REGION
    label: Amazon region
    description: Optional when the managed hosts can read their region through EC2 IMDSv2.
    type: string
    default: ''
    required: false
  - variable: AWS_ACCESS_KEY_ID
    label: AWS access key ID
    description: Optional when the managed hosts use an IAM instance profile.
    type: string
    default: ''
    required: false
  - variable: AWS_SECRET_ACCESS_KEY
    label: AWS secret access key
    description: Optional when the managed hosts use an IAM instance profile.
    type: password
    default: ''
    required: false
  - variable: AWS_SESSION_TOKEN
    label: AWS session token
    description: Optional token for temporary AWS credentials.
    type: password
    default: ''
    required: false
  - variable: ALLOW_CLOUD_PROVISIONING
    label: Allow cloud resource provisioning and deletion
    description: Keep disabled to use existing EFS filesystems only. Enabling this permits encrypted filesystem and mount-target creation and deletion.
    type: boolean
    default: false
    required: true
  - variable: EFS_SUBNET_ID
    label: EFS mount-target subnet ID
    description: Required only when cloud provisioning is enabled.
    type: string
    default: ''
    required: false
  - variable: EFS_SECURITY_GROUP_ID
    label: EFS mount-target security group ID
    description: Required only when cloud provisioning is enabled. The selected group must permit NFS only from trusted clients.
    type: string
    default: ''
    required: false
  - variable: PASTURESTACK_DEBUG
    label: Enable debug logging
    description: Enable verbose storage-driver diagnostics.
    type: boolean
    default: false
    required: true

amazon-efs-storage-driver:
  storage_driver:
    name: pasturestack-efs
    description: Amazon EFS shared file storage
    scope: environment
    volume_access_mode: multiHostRW
    start_on_create: true
