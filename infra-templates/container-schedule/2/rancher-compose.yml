# SPDX-License-Identifier: MIT
.catalog:
  name: PastureStack Container Schedule
  version: v0.6.0-pasturestack.1
  description: Run scheduled start, stop, or restart actions from container labels.
  minimum_rancher_version: v1.6.15-rc1
  labels:
    io.pasturestack.catalog.question.enable_metrics.label.zh-tw: '啟用指標端點'
    io.pasturestack.catalog.question.enable_metrics.description.zh-tw: '在容器連接埠 9191 提供 Prometheus 工作執行次數。'
    io.pasturestack.catalog.question.enable_debug.label.zh-tw: '啟用除錯日誌'
    io.pasturestack.catalog.question.enable_debug.description.zh-tw: '記錄較詳細的事件與排程診斷資訊。'
  questions:
    - variable: ENABLE_METRICS
      label: Enable the metrics endpoint
      description: Expose Prometheus job counts on container port 9191.
      type: boolean
      default: false
      required: true
    - variable: ENABLE_DEBUG
      label: Enable debug logging
      description: Write detailed event and scheduling diagnostics.
      type: boolean
      default: false
      required: true

container-schedule:
  scale: 1
  start_on_create: true
