# SPDX-License-Identifier: MIT
version: '2'
.catalog:
  name: PastureStack System Image Preloader
  version: v0.3.0-pasturestack.1
  description: Preload the container images required by compatible infrastructure stacks.
  minimum_rancher_version: v1.6.15-rc1
  labels:
    io.pasturestack.catalog.question.check_cpu_usage.label.zh-tw: '拉取前檢查 CPU 使用率'
    io.pasturestack.catalog.question.check_cpu_usage.description.zh-tw: '主機 CPU 使用率高於設定上限時暫停等待。'
    io.pasturestack.catalog.question.cpu_usage_max.label.zh-tw: 'CPU 使用率上限'
    io.pasturestack.catalog.question.cpu_usage_max.description.zh-tw: '開始拉取映像前可接受的最高主機 CPU 使用率百分比。'
    io.pasturestack.catalog.question.cpu_usage_sleep.label.zh-tw: 'CPU 檢查重試間隔'
    io.pasturestack.catalog.question.cpu_usage_sleep.description.zh-tw: '兩次 CPU 使用率檢查之間等待的秒數。'
    io.pasturestack.catalog.question.cpu_wait_max_attempts.label.zh-tw: 'CPU 檢查次數上限'
    io.pasturestack.catalog.question.cpu_wait_max_attempts.description.zh-tw: '達到此檢查次數仍無法拉取時，以錯誤結束。'
    io.pasturestack.catalog.question.image_pull_max_attempts.label.zh-tw: '映像拉取次數上限'
    io.pasturestack.catalog.question.image_pull_max_attempts.description.zh-tw: '每個映像拉取失敗達到此次數時，以錯誤結束。'
    io.pasturestack.catalog.question.image_pull_retry_delay_seconds.label.zh-tw: '映像拉取重試間隔'
    io.pasturestack.catalog.question.image_pull_retry_delay_seconds.description.zh-tw: '映像拉取失敗後等待的秒數。'
    io.pasturestack.catalog.question.mount_docker_config.label.zh-tw: '掛載 Docker 用戶端設定'
    io.pasturestack.catalog.question.mount_docker_config.description.zh-tw: '從選取的主機檔案讀取私有登錄登入資訊。'
    io.pasturestack.catalog.question.docker_config_location.label.zh-tw: 'Docker 用戶端設定路徑'
    io.pasturestack.catalog.question.docker_config_location.description.zh-tw: 'Docker 用戶端 config.json 檔案的主機絕對路徑。'
    io.pasturestack.catalog.question.privileged.label.zh-tw: '以特權模式執行'
    io.pasturestack.catalog.question.privileged.description.zh-tw: '只有主機安全性政策確實要求時才能啟用。'
    io.pasturestack.catalog.question.random_sleep.label.zh-tw: '分散各主機的映像拉取時間'
    io.pasturestack.catalog.question.random_sleep.description.zh-tw: '依中繼資料為各主機加入不同的隨機延遲。'
    io.pasturestack.catalog.question.platform_agent_image.label.zh-tw: '其他代理程式映像'
    io.pasturestack.catalog.question.platform_agent_image.description.zh-tw: '基礎架構映像完成後要額外預先下載的選用語意化映像標籤。'
    io.pasturestack.catalog.question.platform_version.label.zh-tw: '相容平台版本'
    io.pasturestack.catalog.question.platform_version.description.zh-tw: '選取相容商店範本修訂版時使用的平台版本。'
    io.pasturestack.catalog.question.platform_tls_verify.label.zh-tw: '驗證平台 TLS 憑證'
    io.pasturestack.catalog.question.platform_tls_verify.description.zh-tw: '要求相容 API 使用受信任的 TLS 憑證。'
  questions:
    - variable: CHECK_CPU_USAGE
      label: Check CPU usage before pulling
      description: Wait while host CPU usage is above the configured limit.
      type: boolean
      default: true
      required: true
    - variable: CPU_USAGE_MAX
      label: Maximum CPU usage
      description: Highest host CPU usage percentage accepted before a pull.
      type: int
      default: 75
      required: true
    - variable: CPU_USAGE_SLEEP
      label: CPU retry delay
      description: Seconds to wait between CPU usage checks.
      type: int
      default: 30
      required: true
    - variable: CPU_WAIT_MAX_ATTEMPTS
      label: Maximum CPU checks
      description: Stop with an error after this many CPU usage checks.
      type: int
      default: 60
      required: true
    - variable: IMAGE_PULL_MAX_ATTEMPTS
      label: Maximum image pull attempts
      description: Stop with an error after this many failed pulls per image.
      type: int
      default: 5
      required: true
    - variable: IMAGE_PULL_RETRY_DELAY_SECONDS
      label: Image pull retry delay
      description: Seconds to wait after a failed image pull.
      type: int
      default: 10
      required: true
    - variable: MOUNT_DOCKER_CONFIG
      label: Mount a Docker client configuration
      description: Read private-registry credentials from the selected host file.
      type: boolean
      default: false
      required: true
    - variable: DOCKER_CONFIG_LOCATION
      label: Docker client configuration path
      description: Absolute host path of the Docker client config.json file.
      type: string
      default: /root/.docker/config.json
      required: true
    - variable: PRIVILEGED
      label: Run in privileged mode
      description: Enable only when the host security policy requires it.
      type: boolean
      default: false
      required: true
    - variable: RANDOM_SLEEP
      label: Stagger image pulls between hosts
      description: Add a metadata-derived random delay between image pulls.
      type: boolean
      default: false
      required: true
    - variable: PLATFORM_AGENT_IMAGE
      label: Additional agent image
      description: Optional semantic image tag to preload after infrastructure images.
      type: string
      default: ''
      required: false
    - variable: PLATFORM_VERSION
      label: Compatible platform version
      description: Version used when selecting compatible Catalog template revisions.
      type: string
      default: v1.6.282
      required: true
    - variable: PLATFORM_TLS_VERIFY
      label: Verify platform TLS certificates
      description: Require a trusted certificate for compatibility API requests.
      type: boolean
      default: false
      required: true

system-image-preloader:
  start_on_create: true
