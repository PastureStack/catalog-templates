version: '2'
services:
  resource-scheduler:
    image: ghcr.io/pasturestack/resource-scheduler:v0.8.16
    command: resource-scheduler --metadata-address 169.254.169.250
    environment:
      PASTURESTACK_DEBUG: '${PASTURESTACK_DEBUG}'
    labels:
      io.rancher.container.create_agent: 'true'
      io.rancher.container.agent_service.scheduling: 'true'
    logging:
      driver: json-file
      options:
        max-size: 25m
        max-file: '2'
