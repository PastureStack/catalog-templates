# SPDX-License-Identifier: MIT
version: '2'
services:
  resource-scheduler:
    image: ghcr.io/pasturestack/resource-scheduler:v0.8.14@sha256:82742768223b8e9284f02e629e831efc1809266a8f2e8fc2049821d142b5e600
    command: resource-scheduler --metadata-address 169.254.169.250
    environment:
      PASTURESTACK_DEBUG: '${PASTURESTACK_DEBUG}'
    labels:
      io.rancher.container.create_agent: 'true'
      io.rancher.container.agent_service.scheduling: 'true'
    logging:
      driver: json-file
      options:
        max-size: 25m
        max-file: '2'
