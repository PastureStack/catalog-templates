# SPDX-License-Identifier: MIT
.catalog:
  name: PastureStack VXLAN Overlay Network
  version: 0.3.0-rc9-pasturestack.1
  description: Provide an unencrypted UDP VXLAN network across managed hosts.
  minimum_rancher_version: v1.6.11-rc1
  labels:
    io.pasturestack.catalog.question.docker_bridge.label.zh-tw: 'Docker 網橋'
    io.pasturestack.catalog.question.docker_bridge.description.zh-tw: '受管工作負載流量使用的主機網橋。'
    io.pasturestack.catalog.question.mtu.label.zh-tw: '網路 MTU'
    io.pasturestack.catalog.question.mtu.description.zh-tw: '請與主機網路 MTU 一致；GCE 常用 1460，一般乙太網路常用 1500。'
    io.pasturestack.catalog.question.pasturestack_debug.label.zh-tw: '啟用除錯日誌'
    io.pasturestack.catalog.question.pasturestack_debug.description.zh-tw: '記錄較詳細的 VXLAN 元件診斷資訊。'
    io.pasturestack.catalog.question.host_ports.label.zh-tw: '啟用主機連接埠'
    io.pasturestack.catalog.question.host_ports.description.zh-tw: '允許受管工作負載在主機上公開連接埠。'
    io.pasturestack.catalog.question.pasturestack_hairpin_mode.label.zh-tw: '啟用 Hairpin 模式'
    io.pasturestack.catalog.question.pasturestack_hairpin_mode.description.zh-tw: 'Hairpin 模式與混雜模式不可同時啟用。'
    io.pasturestack.catalog.question.pasturestack_promiscuous_mode.label.zh-tw: '啟用混雜模式'
    io.pasturestack.catalog.question.pasturestack_promiscuous_mode.description.zh-tw: '混雜模式與 Hairpin 模式不可同時啟用。'
  questions:
  - variable: DOCKER_BRIDGE
    label: Docker bridge
    description: Host bridge used for managed workload traffic.
    type: string
    default: docker0
    required: true
  - variable: MTU
    label: Network MTU
    description: Match the host network MTU; common values are 1460 for GCE and 1500 for Ethernet.
    type: int
    default: 1500
    required: true
  - variable: PASTURESTACK_DEBUG
    label: Enable debug logs
    description: Enable verbose diagnostic logging for the VXLAN components.
    type: boolean
    default: 'false'
    required: true
  - variable: HOST_PORTS
    label: Enable host ports
    description: Allow managed workloads to publish ports on their hosts.
    type: boolean
    default: 'true'
    required: true
  - variable: PASTURESTACK_HAIRPIN_MODE
    label: Enable hairpin mode
    description: Hairpin mode and promiscuous mode must not both be enabled.
    type: boolean
    default: 'false'
    required: true
  - variable: PASTURESTACK_PROMISCUOUS_MODE
    label: Enable promiscuous mode
    description: Promiscuous mode and hairpin mode must not both be enabled.
    type: boolean
    default: 'true'
    required: true
